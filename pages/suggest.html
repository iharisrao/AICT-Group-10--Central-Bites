 </ul>
    </nav>

<section class="suggest-section page-header-spacing">
    <div class="container">
        <h2 class="suggest-title">Suggest a Spot</h2>
        <p class="suggest-subtitle">Know a great place in Central Park? Help us grow the community!</p>
    </div>
</section>

    <div class="form-card">
        <form id="suggestion-form">
            <div class="form-row">
                <div class="form-group">
                    <label>Your Name <span>*</span></label>
                    <input type="text" required placeholder="e.g., Ahmed Khan">
                </div>
                <div class="form-group">
                    <label>Your Email <span>*</span></label>
                    <input type="email" required placeholder="e.g., ahmed@example.com">
                </div>
            </div>
            <div class="form-group">
                <label>Restaurant Name <span>*</span></label>
                <input type="text" required placeholder="e.g., The Golden Fork">
            </div>

            <div class="form-group">
                <label>Location in Central Park <span>*</span></label>
                <input type="text" required placeholder="e.g., Near Fountain">
            </div>

            <div class="form-group">
                <label>Select Vibes</label>
                <div class="vibe-chips">
                    <label class="chip">
                        <input type="checkbox" name="vibe" value="Family Dinner"> 
                        <span>Family Dinner</span>
                    </label>
                    <label class="chip">
                        <input type="checkbox" name="vibe" value="Quick Snack"> 
                        <span>Quick Snack</span>
                    </label>
                    <label class="chip">
                        <input type="checkbox" name="vibe" value="Late Night"> 
                        <span>Late Night</span>
                    </label>
                    <label class="chip">
                        <input type="checkbox" name="vibe" value="Coffee & Chill"> 
                        <span>Coffee & Chill</span>
                    </label>
                    <label class="chip">
                        <input type="checkbox" name="vibe" value="Best View"> 
                        <span>Best View</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Why do you recommend it?</label>
                <textarea rows="4" placeholder="Tell us what makes this spot special..."></textarea>
            </div>

            <button type="submit" class="submit-btn">
                Send Suggestion <span>→</span>
            </button>
        </form>
    </div>
</div>
